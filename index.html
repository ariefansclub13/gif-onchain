<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GIF Onchain</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        GIF ONCHAIN
    </div>


    <nav>

        <a href="index.html">
            Explore
        </a>

        <a href="create.html">
            Create
        </a>

    </nav>

</header>



<section class="hero">

    <h1>
        GIFs,
        <br>
        Onchain.
    </h1>


    <p>
        A creative space for discovering,
        sharing and eventually bringing
        GIF culture onchain.
    </p>


    <div class="buttons">

        <a
            href="#gallery"
            class="btn btn-primary"
        >
            Explore GIFs
        </a>


        <a
            href="create.html"
            class="btn btn-secondary"
        >
            Create GIF
        </a>

    </div>

</section>



<section
    class="gallery"
    id="gallery"
>

    <h2>
        Featured GIFs
    </h2>


    <div class="grid">


        <div class="card">

            <img
                src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif"
                alt="First GIF"
            >

            <div class="card-info">

                <h3>
                    First GIF
                </h3>

                <p>
                    GIF Onchain
                </p>

            </div>

        </div>



        <div class="card">

            <img
                src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif"
                alt="Second GIF"
            >

            <div class="card-info">

                <h3>
                    Second GIF
                </h3>

                <p>
                    GIF Onchain
                </p>

            </div>

        </div>



        <div class="card">

            <img
                src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif"
                alt="Third GIF"
            >

            <div class="card-info">

                <h3>
                    Third GIF
                </h3>

                <p>
                    GIF Onchain
                </p>

            </div>

        </div>


    </div>

</section>


</body>

</html>
